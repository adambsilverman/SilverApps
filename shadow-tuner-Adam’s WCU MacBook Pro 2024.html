<style>
/* Layout: one instrument panel — big note readout, cents meter, pitch trace, then controls. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #1b2430;
  --muted: #5d6a79;
  --line: #d3dae2;
  --brass: #a8741a;
  --good: #1f8a5b;
  --warn: #c07a12;
  --bad: #c2412d;
  --band: rgba(31,138,91,.13);
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171e; --panel: #1a212b; --ink: #e8edf3; --muted: #93a1b2; --line: #2c3644;
    --brass: #e0a943; --good: #3ccf8e; --warn: #f0a43a; --bad: #f2705b; --band: rgba(60,207,142,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171e; --panel: #1a212b; --ink: #e8edf3; --muted: #93a1b2; --line: #2c3644;
  --brass: #e0a943; --good: #3ccf8e; --warn: #f0a43a; --bad: #f2705b; --band: rgba(60,207,142,.14);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 400 28px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
h1 span { color: var(--brass); }
.chip { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.chip.live { color: var(--good); border-color: var(--good); }
.chip.err { color: var(--bad); border-color: var(--bad); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.readout { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px 16px; }
.note { font: 400 clamp(84px, 24vw, 128px)/.9 var(--display); display: flex; align-items: flex-start; min-height: 1em; }
.note sup { font: 500 22px var(--mono); color: var(--muted); margin-top: .5em; margin-left: 6px; }
.note.idle { color: var(--line); }
.cents { text-align: right; font: 500 34px/1 var(--mono); font-variant-numeric: tabular-nums; }
.cents small { display: block; font: 500 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.freqs { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.freqs b { color: var(--ink); font-weight: 500; }
canvas { display: block; width: 100%; }
#meter { height: 70px; margin-top: 14px; }
#trace { height: 120px; }
.label { font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.start { display: flex; gap: 10px; flex-wrap: wrap; }
button.primary {
  flex: 1 1 200px; font: 600 16px var(--body); padding: 14px 18px; border-radius: 12px; cursor: pointer;
  background: var(--ink); color: var(--panel); border: 0;
}
button.primary.on { background: var(--bad); color: #fff; }
button.ghost { font: 500 14px var(--body); padding: 12px 16px; border-radius: 12px; cursor: pointer;
  background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.ghost[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 18px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font: 500 13px var(--body); display: flex; justify-content: space-between; gap: 8px; }
.field output { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--brass); }
select, input[type=number] { font: 14px var(--body); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { margin-top: 3px; accent-color: var(--brass); }
.note-text { font-size: 13px; color: var(--muted); margin: 0; }
.note-text strong { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<header class="site-strip" role="banner"><a class="site-home" href="index.html" aria-label="SilverApps Interactive Music Training — all SilverApps"><img class="site-logo" src="assets/silverapps-logo-light.png?v=3" alt="" width="118" height="30"><span class="lbl-long site-sub">Interactive Music Training</span></a><span class="spacer"></span><span id="saJumpSlot" data-cls="site-btn" hidden></span></header>

<div class="wrap">
  <header>
    <h1>Shadow <span>Tuner</span></h1>
    <span class="chip" id="status">Mic off</span>
  </header>

  <section class="panel" aria-live="off">
    <div class="readout">
      <div class="note idle" id="note">A<sup id="oct">4</sup></div>
      <div class="cents" id="cents">±0<small>cents</small></div>
      <div class="freqs">
        <span>You <b id="fYou">—</b></span>
        <span>Reference <b id="fRef">—</b></span>
        <span>Level <b id="lvl">—</b></span>
      </div>
    </div>
    <canvas id="meter" role="img" aria-label="Cents meter: how far your pitch is from the nearest note"></canvas>
  </section>

  <section class="panel">
    <p class="label">Last 8 seconds</p>
    <canvas id="trace" role="img" aria-label="Pitch trace: your tuning in cents over the last 8 seconds"></canvas>
  </section>

  <div class="start">
    <button class="primary" id="go">Start listening</button>
    <button class="ghost" id="refBtn" aria-pressed="true">Reference tone on</button>
    <button class="ghost" id="outBtn" aria-pressed="false">Output: Headphones</button>
  </div>
  <p class="note-text" id="outNote"></p>
  <div class="start"><button class="ghost" id="srBtn" aria-pressed="false" type="button">Speak readings (screen reader)</button></div>
  <p class="sr-only" id="srRead" role="status" aria-live="polite" aria-atomic="true"></p>

  <section class="panel controls">
    <div class="field">
      <label for="vol">Tone volume <output id="volO"></output></label>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.35">
    </div>
    <div class="field">
      <label for="timbre">Tone colour</label>
      <select id="timbre">
        <option value="pure">Pure (sine)</option>
        <option value="soft" selected>Soft</option>
        <option value="reed">Reed</option>
        <option value="string">Bowed</option>
      </select>
    </div>
    <div class="field">
      <label for="octave">Tone octave</label>
      <select id="octave">
        <option value="-2">Two below</option>
        <option value="-1">One below</option>
        <option value="0" selected>Same as you</option>
        <option value="1">One above</option>
      </select>
    </div>
    <div class="field">
      <label for="a4">A4 reference (Hz)</label>
      <input type="number" id="a4" min="400" max="480" step="0.5" value="440">
    </div>
    <div class="field">
      <label for="gate">Mic sensitivity <output id="gateO"></output></label>
      <input type="range" id="gate" min="-70" max="-20" step="1" value="-48">
    </div>
    <div class="field">
      <label for="tol">In-tune window <output id="tolO"></output></label>
      <input type="range" id="tol" min="2" max="15" step="1" value="5">
    </div>
    <div class="field">
      <label for="rel">Tone hangs on <output id="relO"></output></label>
      <input type="range" id="rel" min="0.05" max="1.5" step="0.05" value="0.2">
    </div>
    <div class="field">
      <label for="names">Note names</label>
      <select id="names">
        <option value="sharp">Sharps (C♯)</option>
        <option value="flat">Flats (D♭)</option>
      </select>
    </div>
  </section>
</div>

<script src="assets/shared/data-shadow-tuner.4010548f13.js"></script>

<script>
/* SilverApps: optional spoken pitch readout for screen-reader users (every 2.5 s while a note is held). */
(function(){
  const btn=document.getElementById("srBtn"), out=document.getElementById("srRead"); let on=false, last="";
  btn.onclick=()=>{ on=!on; btn.setAttribute("aria-pressed", on); out.textContent = on ? "Readings on." : "Readings off."; };
  setInterval(()=>{
    if(!on) return;
    const n=document.getElementById("note"); if(!n || n.classList.contains("idle")) return;
    const name=n.childNodes[0] ? n.childNodes[0].textContent.trim() : "", oct=(document.getElementById("oct")||{}).textContent||"";
    const c=(document.getElementById("cents")||{}).firstChild; const cents=c ? c.textContent.trim() : "";
    const v=parseFloat(cents.replace("±","").replace("−","-")); const say=isNaN(v) ? "" : Math.abs(v) < 1 ? "in tune" : `${Math.abs(Math.round(v))} cents ${v>0?"sharp":"flat"}`;
    const t=`${name.replace("♯"," sharp").replace("♭"," flat")}${oct}, ${say}`; if(t!==last){ last=t; out.textContent=t; }
  }, 2500);
})();
</script>
