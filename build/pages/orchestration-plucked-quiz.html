":["E A D G","G C E A","D G B E"],"why":"Irish players often tune the tenor banjo G D A E, an octave below the mandolin."},{"s":1,"q":"A common Irish bouzouki tuning is…","a":"G D A D","w":["E A D G B E","G C E A","C G D A"],"why":"Four paired courses; G D A E is also used."},{"s":1,"q":"The Greek bouzouki is closest to which family?","a":"the long-necked lutes","w":["the zithers","the harps","the bowed strings"],"why":"A long neck, a rounded back and metal strings in pairs, played with a pick."},{"s":1,"q":"The ukulele's standard tuning (G C E A) is called re-entrant because…","a":"the G string is higher than the C next to it","w":["it has a drone string","it has paired strings","it's tuned in 5ths"],"why":"Low-G tuning replaces the high G with one an octave lower."},{"s":1,"q":"The baritone ukulele is tuned…","a":"D G B E, like the top four strings of a guitar","w":["G C E A","C G D A","G D A E"],"why":"So guitar chord shapes on the top four strings work on it."},{"s":1,"q":"Ukulele music is usually written…","a":"in treble clef at pitch","w":["an octave higher than it sounds","in bass clef","only as chord symbols"],"why":"Chord diagrams and symbols are very common too."},{"s":1,"q":"Which of these instruments has the lowest open string?","a":"the guitar (E2)","w":["the mandolin (G3)","the ukulele (C4)","the 5-string banjo (D3)"],"why":"Irish bouzouki's G2 comes close."},{"s":1,"q":"Plucked instruments compared with bowed strings:","a":"the sound decays quickly after each note","w":["they sustain as long as wanted","they can't play chords","they all sound an octave lower"],"why":"Write tremolo, repeated notes or let-ring chords for sustain."},{"s":1,"q":"When guitar, mandolin or banjo plays with an orchestra or loud band…","a":"they usually need amplification or a light texture around them","w":["they always cover the brass","they double the timpani","they must play only in the bass"],"why":"Keep the accompaniment thin when they play solo lines."},{"s":1,"q":"A capo…","a":"clamps across the strings, raising every open string by the same amount","w":["mutes the strings","tunes a single string","is a type of pick"],"why":"Chord shapes keep their fingering but sound higher."},{"s":2,"q":"In guitar tablature (tab), the lines stand for…","a":"strings, with numbers showing the frets","w":["frets, with numbers showing strings","beats","fingers"],"why":"The top line is the highest string. Tab shows where to play, but often not rhythm."},{"s":2,"q":"In a chord diagram, an x above a string means…","a":"don't play that string","w":["play it open","play it with the thumb","play a harmonic"],"why":"An o means play the string open."},{"s":2,"q":"p i m a in classical guitar music stands for…","a":"the right-hand thumb, index, middle and ring fingers","w":["the left-hand fingers","four dynamics","four strings"],"why":"Left-hand fingers are numbered 1–4 (index to little finger)."},{"s":2,"q":"A circled number such as ③ in guitar music means…","a":"play on that string (here, the 3rd string)","w":["use the 3rd finger","play at fret 3","play three times"],"why":"Roman numerals usually show the position (fret) instead."},{"s":2,"q":"A hammer-on is…","a":"sounding a higher note by fretting it firmly without picking again","w":["a muted strum","a bend","a struck harmonic"],"why":"A pull-off is the reverse: a lower note sounded by pulling a finger off. Both are usually shown with a slur and H or P."},{"s":2,"q":"Palm muting is…","a":"resting the side of the picking hand on the strings near the bridge","w":["pressing every string at fret 12","playing behind the nut","using a capo"],"why":"Marked P.M. It gives short, chunky notes."},{"s":2,"q":"The natural harmonic at the 12th fret sounds…","a":"an octave above the open string","w":["a 5th above the open string","two octaves above","the open string"],"why":"At the 7th fret: an octave and a 5th; at the 5th fret: two octaves."},{"s":2,"q":"Rasgueado is…","a":"a flamenco strum flicking the fingers out one after another","w":["a pick tremolo","a tapping technique","a slide"],"why":"It gives a rattling, rolled strum."},{"s":2,"q":"A banjo 'roll' is…","a":"a repeating right-hand picking pattern, often in eighth notes","w":["a drum roll on the head","a tremolo with a pick","a strum"],"why":"Three-finger (Scruggs-style) rolls and clawhammer (strumming down with the back of a nail) are the two main styles."},{"s":2,"q":"A string bend raises the pitch by…","a":"pushing the string sideways along the fret","w":["using a capo","pressing harder on the fret","tuning the string"],"why":"Marked with an arrow and the amount (½ = a semitone, full = a whole tone)."},{"s":2,"q":"Slash notation with chord symbols in a guitar part means…","a":"strum or comp in the style, following the chords","w":["rest","play the melody","play only roots"],"why":"Rhythm slashes with stems show a specific strumming rhythm."},{"s":2,"q":"Strumming arrows ↑ and ↓ in guitar parts usually show…","a":"upstroke and downstroke (often written as V and ⊓, like bowings)","w":["louder and softer","higher and lower strings only","bends"],"why":"Downstrokes are heavier; strummed eighths are usually down-up."},{"s":2,"q":"Why are open-string chords popular on guitar, mandolin and ukulele?","a":"open strings ring longer and are easier to play","w":["they're louder in the bass","they need no tuning","they're the only chords possible"],"why":"Keys like E, A, D and G suit the guitar; flat keys often lead players to use a capo."},{"s":2,"q":"For guitar, a 'let ring' marking means…","a":"let the notes sustain into each other","w":["mute after each note","play harmonics","repeat the bar"],"why":"Like l.v. for harp and percussion."}];
