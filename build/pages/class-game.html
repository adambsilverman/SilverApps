<!-- title: Class Game | desc: A team quiz game for class, made with the SilverApps test maker: questions from the units your professor chose, shown big for the room, with team scores. -->
<style>
.cg{max-width:1100px;margin:0 auto;padding:18px 16px 48px}
.cg h1{font:400 clamp(36px,6vw,64px)/.95 var(--fi-display);margin:0;border-top:2px solid var(--fi-red);padding-top:10px}
.cg a{color:var(--fi-red-dk)}
.cg .warn{background:#fff4d6;border-left:6px solid #c98a00;padding:10px 14px;border-radius:6px;color:#231d19}
.cg .board{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.cg .team{flex:1 1 160px;border:2px solid var(--fi-line);border-radius:var(--fi-r);background:var(--fi-card);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cg .team b{font:400 clamp(22px,3vw,30px)/1 var(--fi-display)}
.cg .team .pts{font:400 clamp(30px,5vw,46px)/1 var(--fi-display)}
.cg .team.lead{border-color:var(--fi-red)}
.cg .card{border:2px solid var(--fi-ink);border-radius:var(--fi-r);background:var(--fi-card);padding:18px 22px;margin-top:8px}
.cg .meta{font:900 13px var(--fi-body);letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cg .q{font:600 clamp(22px,3.2vw,36px)/1.3 var(--fi-serif);margin:0 0 16px}
.cg .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:10px}
.cg .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:2px solid var(--fi-line);border-radius:14px;font:clamp(18px,2.4vw,26px)/1.35 var(--fi-serif);background:#fff;color:var(--fi-ink)}
.cg .opt .L{font:400 clamp(22px,3vw,32px)/1 var(--fi-display);min-width:1.2em}
.cg .opt.right{border-color:#1d6b2f;background:#e5f3e4}
.cg .opt.dim{color:#6b625a;border-style:dashed}
.cg .why{font:clamp(17px,2vw,22px)/1.45 var(--fi-serif);margin:14px 0 0}
.cg .timer{height:10px;border-radius:5px;background:var(--fi-line);overflow:hidden;margin:4px 0 14px}
.cg .timer i{display:block;height:100%;background:var(--fi-red);width:100%;transition:width .25s linear}
.cg .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.cg .btn{font:700 16px var(--fi-ui);text-transform:uppercase;letter-spacing:.04em;padding:11px 18px;min-height:46px;border-radius:999px;border:1.5px solid var(--fi-line);background:var(--fi-card);color:var(--fi-ink);cursor:pointer}
.cg .btn.primary{background:var(--fi-red);border-color:var(--fi-red);color:#000}
.cg .btn:focus-visible{outline:3px solid var(--fi-red-dk);outline-offset:2px}
.cg .joke{margin-top:16px}.cg .joke .saq-joke{font-size:clamp(18px,2.2vw,24px)}.cg .joke .saq-joke-o{font-size:clamp(16px,2vw,22px)}
.cg .keys{font:14px var(--fi-serif);color:var(--fi-ink-2,#5c544c);margin-top:18px}
.cg .rn{white-space:nowrap} .cg .fg{display:inline-flex;flex-direction:column;font-size:.62em;line-height:.95;vertical-align:-.15em;margin-left:1px} .cg .rq{font-size:.8em;vertical-align:.35em}
</style>
<script src="assets/test-bank.js"></script>
<main id="main" class="cg">
<h1 id="cgTitle">Class game</h1>
<div id="cgBoard" class="board" aria-live="polite"></div>
<div id="cgBody"></div>
<p class="keys">Keys: <b>Space</b> shows the answer, <b>1</b>–<b>4</b> gives the point to a team, <b>N</b> or <b>→</b> goes to the next question.</p>
</main>
<script>
(() => {
  const BANK = window.SA_BANK || [], $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const RNRE = /^([♭♯]?)(It|Fr|Ger|[ivIV]+)([°ø+]?)(\d*)$/;
  const rnPart = p => { const m = RNRE.exec(p); if (!m) return esc(p); let h = m[1] + m[2]; if (m[3]) h += `<span class="rq">${m[3]}</span>`; const f = m[4];
    return h + (f.length === 2 ? `<span class="fg"><span>${f[0]}</span><span>${f[1]}</span></span>` : f ? `<sup>${f}</sup>` : ""); };
  const rich = s => esc(s).replace(/\{rn:([^}]+)\}/g, (_, t) => `<span class="rn">${t.split("/").map(rnPart).join("/")}</span>`).replace(/\{sym:([^}]+)\}/g, "$1");
  let C = null;
  try { const h = (location.hash.match(/[#&]g=([\w-]+)/) || [])[1]; C = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(h.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)))); } catch (e) {}
  const body = $("cgBody");
  if (!C || !C.u) { body.innerHTML = '<p class="warn">This game link is incomplete. Make a new one on the <a href="test-maker.html">test maker</a>.</p>'; return; }
  const units = C.u.map(id => BANK.find(u => u.id === id)).filter(Boolean);
  if (!units.length) { body.innerHTML = '<p class="warn">The questions for this game couldn\'t be found. Make a new one on the <a href="test-maker.html">test maker</a>.</p>'; return; }
  const TITLE = String(C.t || "Class game").slice(0, 80); $("cgTitle").textContent = TITLE; document.title = TITLE + " · " + document.title.split(" · ").slice(1).join(" · ");
  const TEAMS = (C.teams && C.teams.length ? C.teams : ["Team 1", "Team 2"]).slice(0, 4).map(String), SECS = +C.sec || 0;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // a fresh mix every time the page opens: questions spread evenly across the chosen units
  const pools = units.map(u => shuffle(u.qs.map(q => Object.assign({ unit: u.title, uid: u.id, section: u.section }, q)))), Q = [];
  const want = Math.min(C.n || 20, pools.reduce((n, p) => n + p.length, 0));
  while (Q.length < want) shuffle(pools.filter(p => p.length)).forEach(p => { if (Q.length < want) Q.push(p.shift()); });
  const G = { i: 0, shown: false, pts: TEAMS.map(() => 0), got: null, t0: 0 };
  // jokes (approved ones only, from assets/jokes.js), one between every five questions, matched to the question's unit or section
  let JOKES = null; const sj = document.createElement("script"); sj.src = "assets/jokes.js"; sj.onload = () => { JOKES = window.SA_JOKES || null; }; document.head.appendChild(sj);
  const jokeFor = q => { if (!JOKES) return null; const sec = (JOKES.sections || {})[q.uid] || "", js = JOKES.jokes.filter(j => (j.units || []).includes(q.uid) || (j.topics || []).includes(sec)); const pool = js.length ? js : JOKES.jokes.filter(j => (j.topics || []).includes("any")); return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null; };
  function board() { const top = Math.max(...G.pts); $("cgBoard").innerHTML = TEAMS.map((t, i) => `<div class="team${G.pts[i] === top && top > 0 ? " lead" : ""}"><b>${esc(t)}</b><span class="pts" aria-label="${esc(t)}: ${G.pts[i]} point${G.pts[i] === 1 ? "" : "s"}">${G.pts[i]}</span></div>`).join(""); }
  let tick = 0;
  function draw() {
    clearInterval(tick); board();
    if (G.i >= Q.length) {
      const top = Math.max(...G.pts), win = TEAMS.filter((t, i) => G.pts[i] === top);
      body.innerHTML = `<div class="card"><p class="q">${top ? (win.length > 1 ? `A tie: ${win.map(esc).join(" and ")}, with ${top} point${top === 1 ? "" : "s"} each.` : `${esc(win[0])} wins, with ${top} point${top === 1 ? "" : "s"}.`) : "No points this game."}</p>
        <div class="row"><button type="button" class="btn primary" data-cg="again">Play again (new questions)</button><a class="btn" href="test-maker.html">Make another game</a></div></div>`;
      return;
    }
    const q = Q[G.i]; if (!q.opts) q.opts = shuffle([q.a].concat(q.w || []));
    const brk = G.i > 0 && G.i % 5 === 0 && !G.shown ? jokeFor(Q[G.i - 1]) : null;
    body.innerHTML = `<div class="card"><p class="meta"><span>Question ${G.i + 1} of ${Q.length}</span><span>${esc(q.unit)}</span></p>
      ${SECS ? `<div class="timer" aria-hidden="true"><i id="cgBar"></i></div><p class="sr-only" id="cgLeft" aria-live="polite"></p>` : ""}
      <p class="q">${rich(q.q)}</p>
      <div class="opts">${q.opts.map((o, k) => `<div class="opt${G.shown ? (o === q.a ? " right" : " dim") : ""}"><span class="L">${"ABCD"[k]}</span><span>${rich(o)}</span></div>`).join("")}</div>
      ${G.shown ? `<p class="why"><b>Answer: ${"ABCD"[q.opts.indexOf(q.a)]}.</b> ${rich(q.why || "")}</p>
        <div class="row">${TEAMS.map((t, i) => `<button type="button" class="btn${G.got === i ? " primary" : ""}" data-cg="pt" data-team="${i}" aria-pressed="${G.got === i}">+1 ${esc(t)}</button>`).join("")}<button type="button" class="btn primary" data-cg="next">Next question →</button></div>`
        : `<div class="row"><button type="button" class="btn primary" data-cg="show">Show the answer</button></div>`}
      ${brk && window.SAjoke ? `<div class="joke">${SAjoke.html(brk)}</div>` : ""}</div>`;
    if (SECS && !G.shown) { G.t0 = Date.now(); const bar = $("cgBar"), left = $("cgLeft");
      tick = setInterval(() => { const r = Math.max(0, 1 - (Date.now() - G.t0) / (SECS * 1000)); if (bar) bar.style.width = (r * 100) + "%"; if (r <= 0) { clearInterval(tick); if (left) left.textContent = "Time's up."; } }, 250); }
  }
  function act(a, team) {
    if (a === "show") { G.shown = true; draw(); }
    else if (a === "pt") { if (G.got != null) G.pts[G.got]--; G.got = G.got === team ? null : team; if (G.got != null) G.pts[G.got]++; draw(); }
    else if (a === "next") { G.i++; G.shown = false; G.got = null; draw(); }
    else if (a === "again") location.reload();
  }
  document.addEventListener("click", e => { const b = e.target.closest("[data-cg]"); if (b) act(b.dataset.cg, +b.dataset.team); });
  document.addEventListener("keydown", e => { if (e.target.closest("input,select,textarea,summary")) return;
    if (e.key === " " && !G.shown && G.i < Q.length) { e.preventDefault(); act("show"); }
    else if ((e.key === "n" || e.key === "N" || e.key === "ArrowRight") && G.shown) act("next");
    else if (/^[1-4]$/.test(e.key) && G.shown && +e.key <= TEAMS.length) act("pt", +e.key - 1); });
  draw();
})();
</script>
