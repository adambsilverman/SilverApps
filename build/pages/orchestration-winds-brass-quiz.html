(() => {
  // s = the topic in the drills app (STEPS); "Look back" opens the drills app.
  const QZ = [{"s":1,"q":"Which woodwinds make their sound without a reed or buzzing lips?","a":"the flute family","w":["the oboe family","the clarinet family","the saxophone family"],"why":"Air is directed across the embouchure hole, free of a mouthpiece."},{"s":1,"q":"The most common auxiliary instrument in the orchestra is the…","a":"piccolo","w":["English horn","bass clarinet","contrabassoon"],"why":"It's virtually a half-size flute sounding an octave higher."},{"s":1,"q":"The piccolo's lowest written note is…","a":"D4","w":["C4","B3","E4"],"why":"The flute goes down to C4 (or B3 with a B foot)."},{"s":1,"q":"Where is the flute weakest?","a":"in its lowest register","w":["in its top octave","in the middle of the staff","it's equally strong throughout"],"why":"Notes in the staff or below add little to a full tutti."},{"s":1,"q":"Compared with other winds, the flute needs…","a":"more air and more breaths","w":["less air than any other wind","no breaths in long phrases","circular breathing"],"why":"Overlapping two flutes can make an endless line."},{"s":1,"q":"The oboe's dynamic shape is the inverse of the flute's: its basic volume…","a":"diminishes as it goes higher","w":["grows as it goes higher","is the same in every register","is loudest at the very top"],"why":"Its overall dynamic range is relatively limited."},{"s":1,"q":"What makes the oboe's sound so distinctive?","a":"its double reed","w":["its single reed","its conical brass body","its wide bell"],"why":"Oboists spend much of their lives making and adjusting reeds."},{"s":1,"q":"Why can an oboist sustain such long lines?","a":"the oboe uses far less air than normal breathing","w":["the oboe has a breath reservoir","the oboist breathes through the nose while playing","the reed stores air"],"why":"Players must exhale stale air as well as inhale during breaks."},{"s":1,"q":"The English horn is pitched…","a":"a perfect fifth below the oboe","w":["an octave below the oboe","a fourth below the oboe","a major second below the oboe"],"why":"It's neither a horn nor English; the English call it cor anglais."},{"s":1,"q":"The English horn's lowest written note is…","a":"B3","w":["B♭3","C4","A3"],"why":"The B♭ key would fall where the d'amore bell is."},{"s":1,"q":"The bulb-shaped bell of the English horn is called…","a":"a d'amore bell","w":["a bocal","a crook","a bell flare"],"why":"The metal pipe connecting reed to body is a bocal (also on bassoons)."},{"s":1,"q":"Clarinets have a cylindrical bore, which favors…","a":"the odd partials of the harmonic series","w":["the even partials","only the fundamental","no partials at all"],"why":"The strong 3rd partial gives the clarinet its smooth, hollow sound."},{"s":1,"q":"The clarinet overblows at the…","a":"twelfth","w":["octave","fifth","double octave"],"why":"Flutes, oboes, saxophones and bassoons overblow at the octave."},{"s":1,"q":"The clarinet's low register, from written E3 to about F4, is called the…","a":"chalumeau register","w":["clarion register","altissimo register","throat register"],"why":"Dark, rich and hollow."},{"s":1,"q":"The least colorful notes of the clarinet, just above the chalumeau, are the…","a":"throat tones","w":["clarion tones","pedal tones","altissimo tones"],"why":"Good players and instruments minimize this pocket."},{"s":1,"q":"Which woodwind can begin a note from nothing (niente) and play at the threshold of audibility?","a":"clarinet","w":["oboe","bassoon","piccolo"],"why":"Its dynamic range practically doubles that of other woodwinds except saxophones."},{"s":1,"q":"On the clarinet, which kind of leap is nearly impossible to slur?","a":"downward leaps of a 10th or more","w":["upward leaps of a 10th","any step","octave leaps up"],"why":"Slurring large skips upward is no problem."},{"s":1,"q":"Why did orchestras use clarinets in both B♭ and A?","a":"one for flat keys and one for sharp keys","w":["one for loud and one for soft music","one for solo and one for section playing","to cover a wider range"],"why":"Most professional clarinetists own both."},{"s":1,"q":"The saxophone is classed as a woodwind because…","a":"it uses a single reed","w":["it is made of wood","it has a cylindrical bore","it has valves"],"why":"All saxophones are made of brass."},{"s":1,"q":"Who invented the whole saxophone family around 1840?","a":"Adolphe Sax","w":["Theobald Boehm","Hector Berlioz","Johann Denner"],"why":"The entire family appeared at once, so it is unusually consistent."},{"s":1,"q":"The common saxophone quartet is…","a":"B♭ soprano, E♭ alto, B♭ tenor, E♭ baritone","w":["E♭ sopranino, B♭ soprano, E♭ alto, B♭ bass","C soprano, F alto, C tenor, F baritone","B♭ alto, E♭ tenor, B♭ baritone, E♭ bass"],"why":"B♭ bass, E♭ sopranino and E♭ contrabass are rarer."},{"s":1,"q":"Saxophones blend especially well with…","a":"brass","w":["percussion","harp","voices only"],"why":"In bands they bridge the woodwinds and brass."},{"s":1,"q":"Bassoons are…","a":"double-reed, conical-bore instruments","w":["single-reed, cylindrical-bore instruments","edge-tone instruments","brass instruments with a reed"],"why":"Less nasal and more relaxed than the oboes."},{"s":1,"q":"The bassoon's high register is preferably written in…","a":"tenor clef","w":["alto clef","treble 8vb clef","percussion clef"],"why":"Treble clef is becoming more common; bassoonists read bass-clef ledger lines up to B4."},{"s":1,"q":"The contrabassoon sounds…","a":"an octave lower than written","w":["as written","a fifth lower than written","two octaves lower than written"],"why":"It plays lower than any orchestral instrument except the piano (by one semitone)."},{"s":1,"q":"Which woodwind has the narrowest dynamic range?","a":"bassoon","w":["clarinet","saxophone","flute"],"why":"Its timbre is almost always attractive, adding warmth to any context."},{"s":1,"q":"Woodwind keys raise the pitch by…","a":"opening tone holes, shortening the air column","w":["adding tubing","tightening the reed","changing the mouthpiece"],"why":"Brass valves do the opposite: they add tubing."},{"s":1,"q":"All brass instruments make their sound by…","a":"buzzing the lips into a mouthpiece","w":["vibrating a reed","blowing across an edge","striking the bell"],"why":"The flaring bell amplifies the sound and helps upper partials."},{"s":1,"q":"Which brass instruments have proportionally more conical tubing, giving a darker sound?","a":"horns and tubas","w":["trumpets and trombones","trumpets and tubas","cornets and trombones"],"why":"Trumpets and trombones are more cylindrical."},{"s":1,"q":"The horn mouthpiece is…","a":"funnel-shaped","w":["a deep cup","a shallow cup","a reed"],"why":"Other brass mouthpieces have cups; shallow cups sound brighter."},{"s":1,"q":"All modern horn parts are written in…","a":"F, sounding a perfect fifth lower","w":["B♭, sounding a major second lower","C, at concert pitch","E♭, sounding a major sixth lower"],"why":"Bass clef is used for the lowest notes."},{"s":1,"q":"Horns 1 and 3 are traditionally the…","a":"high horns (2 and 4 are the low horns)","w":["low horns","solo horns","stopped horns"],"why":"The pairs come from writing two pairs of horns in different keys."},{"s":1,"q":"Which brass instrument is generally the most tiring to play?","a":"horn","w":["tuba","trombone","euphonium"],"why":"Orchestras often hire an assistant principal horn."},{"s":1,"q":"Which is arguably the loudest, most powerful orchestral instrument (organ and some percussion aside)?","a":"trumpet","w":["horn","trombone","piccolo"],"why":"A single trumpet at f in its middle-high register can always be heard."},{"s":1,"q":"The default trumpets today are…","a":"B♭ and C trumpets","w":["F and E♭ trumpets","D and A trumpets","bass and piccolo trumpets"],"why":"B♭ is slightly fuller, C slightly brighter."},{"s":1,"q":"Cornet and flugelhorn are mellower than the trumpet because…","a":"they have more conical tubing","w":["they are made of wood","they use a double reed","they have no valves"],"why":"The flugelhorn is completely conical except the valve tubing."},{"s":1,"q":"The trombone's slide has how many positions?","a":"seven, spanning a tritone","w":["five, spanning a fourth","three, spanning a minor third","twelve, spanning an octave"],"why":"It allows complete control of intonation and glissandos up to a tritone."},{"s":1,"q":"The F attachment on a trombone lowers the first-position fundamental from B♭1 to…","a":"F1","w":["E♭1","C1","G1"],"why":"It adds a third more tubing and makes the low E♭2 to C2 available."},{"s":1,"q":"The standard orchestral trombone section is…","a":"two tenor trombones and one bass trombone","w":["three tenor trombones","alto, tenor and bass trombones","two bass trombones and a tuba"],"why":"“Trombone” alone means tenor trombone."},{"s":1,"q":"Pedal tones are more effective on which brass instrument than any other?","a":"trombone","w":["trumpet","horn","piccolo trumpet"],"why":"Easier still on bass trombone than tenor."},{"s":1,"q":"The heart of the tuba's range is about…","a":"C2 to G3","w":["C4 to G5","C1 to G1","C3 to G4"],"why":"Its lowest octave responds slowly."},{"s":1,"q":"The euphonium has exactly the same range as…","a":"the tenor trombone","w":["the horn","the tuba","the trumpet"],"why":"It's sometimes called tenor tuba in orchestral scores."},{"s":1,"q":"Which needs the most air of the brass?","a":"tuba","w":["trumpet","horn","piccolo trumpet"],"why":"A tuba player breathes about twice as often as a trumpet or horn player."},{"s":2,"q":"Which brass mute is by far the most common, and works at any dynamic?","a":"straight mute","w":["cup mute","Harmon mute","plunger"],"why":"It gives a reedy, edgy tone, especially insistent at f."},{"s":2,"q":"Which mute gives a darker, mellower tone that blends with woodwinds and strings?","a":"cup mute","w":["straight mute","Harmon mute","solotone mute"],"why":"The cup catches the sound after it leaves the bell."},{"s":2,"q":"Which mute is filled with sound-absorbing material and clips onto the bell?","a":"bucket mute","w":["cup mute","practice mute","straight mute"],"why":"It sounds like an echo, stripped of brilliance."},{"s":2,"q":"The Harmon mute with the stem removed sounds…","a":"extremely stuffy and focused","w":["bright and metallic","exactly like open horn","louder than open"],"why":"“Stem in” is bright and metallic; avoid the ambiguous “stem out.”"},{"s":2,"q":"Which is the quietest brass mute?","a":"practice mute","w":["cup mute","straight mute","hat"],"why":"Playing loudly with it is impossible."},{"s":2,"q":"Which mutes are available for tuba?","a":"straight mutes (and practice mutes, rarely)","w":["cup and Harmon mutes","plungers and hats","stopping mutes"],"why":"Tuba mutes are large, heavy and slow to insert."},{"s":2,"q":"Horns normally use…","a":"a straight mute or a stopping mute","w":["a plunger","a Harmon mute","a bucket mute"],"why":"Other horn mutes are so rare that “mute” for horn means straight mute."},{"s":2,"q":"How long can it take to put a mute in securely?","a":"up to about 10 seconds","w":["about one second","one beat at any tempo","no time at all"],"why":"Changing from one mute to another takes even longer; a dropped mute is disastrous."},{"s":2,"q":"Stopped horn (hand fully in the bell) raises the pitch…","a":"a minor second, so the player fingers a half step lower","w":["a fifth","an octave","not at all"],"why":"It's notated normally; loud stopped horn sounds nasal and sinister."},{"s":2,"q":"Half-stopping (echo horn) lowers the pitch about…","a":"a minor second, with a distant muted sound","w":["a major third","an octave","a quarter tone"],"why":"The player fingers a half step higher to compensate."},{"s":2,"q":"Circular breathing works by…","a":"breathing in through the nose while pushing air out with the cheeks","w":["breathing between every note","using a second player","playing only short notes"],"why":"It's a rare skill; don't assume it in standard writing."},{"s":2,"q":"One way to make a wind multiphonic is to…","a":"sing while playing","w":["play with a mute","play staccato","use the F attachment"],"why":"Possible on all brass, flutes and single reeds; it creates a difference tone."},{"s":2,"q":"Another way to make woodwind multiphonics is…","a":"special fingerings with controlled overblowing","w":["double tonguing","a cup mute","playing into the stand"],"why":"Most common on saxophones, clarinets and flutes."},{"s":2,"q":"A brass lip trill is only possible where…","a":"the partials are a step or half step apart","w":["valves are pressed","a mute is used","pedal tones are played"],"why":"A wider lip tremolo is a “shake.”"},{"s":2,"q":"Half-step valve trills use…","a":"the 2nd valve","w":["the 1st valve","the 3rd valve","all three valves"],"why":"Whole-step valve trills use the 1st valve."},{"s":2,"q":"Brass instruments generally need…","a":"more rests than woodwinds","w":["fewer rests than woodwinds","no rests at all","rests only at ff"],"why":"Lip endurance matters; low and loud notes use more air."},{"s":2,"q":"Much of the rhythmic energy in brass writing comes from…","a":"repeated notes, single-, double- or triple-tongued","w":["wide leaps","trills","glissandos only"],"why":"Brass are less agile than woodwinds for rapid or disjunct notes."},{"s":3,"q":"In the score, woodwinds are grouped in which order (top to bottom)?","a":"flutes, oboes, clarinets, bassoons","w":["oboes, flutes, bassoons, clarinets","clarinets, flutes, oboes, bassoons","flutes, clarinets, oboes, bassoons"],"why":"Then the brass: horns, trumpets, trombones, tuba."},{"s":3,"q":"In an orchestral score, brass are ordered…","a":"horns, trumpets, trombones, tuba","w":["trumpets, horns, trombones, tuba","tuba, trombones, trumpets, horns","trumpets, trombones, horns, tuba"],"why":"Horns sit above trumpets even though they're lower in pitch."},{"s":3,"q":"When a player doubles an auxiliary (flute and piccolo), who usually plays it?","a":"the last-chair player (e.g. flute 3 doubles piccolo)","w":["the principal player","the second player","a percussionist"],"why":"Oboe 3 doubles English horn, and so on."},{"s":3,"q":"In a wind band score, where is the saxophone choir usually placed?","a":"between the woodwinds and the brass","w":["above the flutes","below the tuba","with the percussion"],"why":"Often AATB or SATB."},{"s":3,"q":"In a big band chart, the saxophone section is typically…","a":"AATTB, above the brass","w":["SATB, below the brass","a single alto","AATB with the rhythm section"],"why":"Five saxes: two altos, two tenors, baritone."},{"s":3,"q":"In chamber music and band scores, the horns' position…","a":"varies: sometimes above, sometimes below the trumpets","w":["is always at the top of the score","is always below the tuba","is always with the woodwinds"],"why":"In orchestral scores, horns come first in the brass."},{"s":3,"q":"Why must wind writing leave places to breathe?","a":"players must pause to inhale, which shapes phrasing and endurance","w":["it doesn't: winds can sustain forever","only to turn pages","only in slow music"],"why":"Unplayable passages come from ignoring breath."},{"s":4,"q":"Brass pitch depends on two things:","a":"the fundamental (valves or slide) and the partial (embouchure)","w":["the reed and the fingering","the bell and the mute","tube length only"],"why":"Pressing the right valve doesn't guarantee the right note: the lips choose the partial."},{"s":4,"q":"Valves and slides lower the pitch by…","a":"adding tubing","w":["opening tone holes","tightening the lips","shortening the bell"],"why":"That's the opposite of woodwind keys."},{"s":4,"q":"Which partials are nearly a quarter tone flat?","a":"the 7th and 11th","w":["the 2nd and 4th","the 3rd and 6th","the 5th and 10th"],"why":"Trumpets and trombones rarely play above the 10th partial."},{"s":4,"q":"The modern trumpet responds most comfortably to partials…","a":"3 through 8","w":["1 through 3","8 through 16","only the fundamental"],"why":"The horn's core uses higher partials, which are closer together, so horn players miss more notes."},{"s":4,"q":"Large leaps on brass instruments are…","a":"substantially harder than on other instruments","w":["easier than steps","the same as on woodwinds","impossible"],"why":"The lips must find each new partial."},{"s":4,"q":"A trombone slide glissando is possible only…","a":"between positions on the same partial (up to a tritone)","w":["across any interval","with a mute","on the F attachment only"],"why":"Lip glisses across partials can fake larger ones."},{"s":4,"q":"Before valves, natural brass instruments could play…","a":"only the partials of one fundamental (the instrument's key)","w":["every chromatic note","only the fundamental","only one octave"],"why":"Players changed crooks to change key."}];
