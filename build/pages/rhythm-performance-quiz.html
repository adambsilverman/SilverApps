<!-- title: Test Yourself: Ear Training – Rhythm | sound: 1 | vex: 1 | desc: A listening quiz with a report for your professor: choose the skills (meter, beat division, rhythmic dictation), hear each question and choose what you heard. -->
<style>
.qz{max-width:820px;margin:0 auto;padding:22px 16px 48px}
.qz h1{font:400 clamp(44px,8vw,78px)/.92 var(--fi-display);margin:0;border-top:2px solid var(--fi-red);padding-top:12px}
.qz h1 span{color:var(--fi-red-dk)}
.qz .lead{max-width:66ch} .qz a{color:var(--fi-red-dk)}
.qz .other{font:700 15px var(--fi-ui);margin:4px 0 18px}
.qz fieldset{border:1.5px solid var(--fi-line);border-radius:var(--fi-r);background:var(--fi-card);padding:10px 16px 14px;margin:0 0 18px}
.qz legend{font:900 12px var(--fi-body);letter-spacing:.1em;text-transform:uppercase;padding:0 6px}
.qz .sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 16px}
.qz .sk label{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font:16px/1.35 var(--fi-serif);cursor:pointer}
.qz .sk input{width:20px;height:20px;margin:1px 0 0;flex:none}
.qz .sk-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.qz .sk-msg{margin:6px 0 0;font:600 15px var(--fi-serif)}
.qz .opt svg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.qz .opt svg path,.qz .opt svg rect,.qz .opt svg text{fill:currentColor}
.qz .opt svg path[fill="none"]{fill:none}
#rqScratch{position:absolute;left:-9999px;top:0;width:300px}
.qz .btn{font:700 15px var(--fi-ui);text-transform:uppercase;letter-spacing:.04em;padding:9px 16px;border-radius:999px;border:1.5px solid var(--fi-line);background:var(--fi-card);color:var(--fi-ink);cursor:pointer;text-decoration:none;display:inline-block}
.qz .btn.primary{background:var(--fi-red);border-color:var(--fi-red);color:#000}
.qz .btn:hover:not(:disabled){background:var(--fi-ink);color:#fff;border-color:var(--fi-ink)}
.qz .btn:focus-visible{outline:3px solid var(--fi-red-dk);outline-offset:2px}
</style>
<main id="main" class="qz" data-sa-quiz="Ear Training – Rhythm">
<h1><span>Test</span> Yourself</h1>
<p class="lead">A listening quiz on the skills practiced in <a href="rhythm-performance.html">Ear Training – Rhythm</a>. Choose the skills to include, then press <b>Play</b> on each question and choose what you heard. Play it as often as you like.</p>
<p class="other"><a href="rhythm-performance.html">← Practice: Ear Training – Rhythm</a></p>
<fieldset id="rqSkills"><legend>Skills in this quiz</legend><div class="sk"></div>
<div class="sk-row"><button type="button" class="btn" id="rqAll">Select all</button><button type="button" class="btn primary" id="rqGo">Start the quiz</button><button type="button" class="btn" id="rqLink">Copy a link to this set</button></div>
<p class="sk-msg" id="rqMsg" role="status" aria-live="polite"></p></fieldset>
<div id="saqBox"></div>
<div id="rqScratch" aria-hidden="true"></div>
</main>
<script>
(() => {
  const SK = [["meter", "Meter: beats in a bar", true], ["div", "Simple or compound", true], ["d1", "Dictation: quarters, eighths, halves", true], ["d2", "Dictation: sixteenths and dotted notes", false]];
  const KEY = "silverapps-rqq-skills";
  let chosen; try { chosen = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  const url = new URLSearchParams(location.search).get("skills");
  if (url) chosen = url.split(",").filter(k => SK.some(s => s[0] === k));
  if (!Array.isArray(chosen) || !chosen.length) chosen = SK.filter(s => s[2]).map(s => s[0]);
  const box = document.querySelector("#rqSkills .sk");
  box.innerHTML = SK.map(([k, n]) => `<label><input type="checkbox" value="${k}"${chosen.includes(k) ? " checked" : ""}> <span>${n}</span></label>`).join("");
  const picked = () => [...box.querySelectorAll("input:checked")].map(i => i.value);
  const rnd = n => Math.floor(Math.random() * n), pickOne = a => a[rnd(a.length)];

  // ---- rhythms: a bar of 4/4 is a list of cells; each cell is a list of [duration in beats, VexFlow duration, rest?, dotted?] ----
  const C = {
    q: [[1, "q"]], qr: [[1, "q", 1]], e2: [[.5, "8"], [.5, "8"]], h: [[2, "h"]],
    s4: [[.25, "16"], [.25, "16"], [.25, "16"], [.25, "16"]], es: [[.5, "8"], [.25, "16"], [.25, "16"]], se: [[.25, "16"], [.25, "16"], [.5, "8"]],
    ds: [[.75, "8", 0, 1], [.25, "16"]], qde: [[1.5, "q", 0, 1], [.5, "8"]],
  };
  const LEN = k => C[k].reduce((t, n) => t + n[0], 0);
  const WORD = { q: "quarter", qr: "quarter rest", e2: "two eighths", h: "half", s4: "four sixteenths", es: "eighth and two sixteenths", se: "two sixteenths and an eighth", ds: "dotted eighth and sixteenth", qde: "dotted quarter and eighth" };
  const LV = { d1: ["q", "q", "e2", "e2", "h", "qr"], d2: ["q", "e2", "s4", "es", "se", "ds", "qde"] };
  function bar(lv) { for (;;) { const out = []; let t = 0; while (t < 4) { const k = pickOne(LV[lv]), L = LEN(k); if (t + L > 4 || (L === 2 && t % 2) || (k === "qde" && t % 2)) continue; out.push(k); t += L; } if (out.some(k => k !== "q")) return out; } }
  function variant(b, lv) {   // the same bar with one beat-cell changed (or two neighbors swapped)
    for (let n = 0; n < 50; n++) { const v = b.slice(), i = rnd(v.length);
      if (Math.random() < .3 && i + 1 < v.length && v[i] !== v[i + 1] && !(LEN(v[i]) !== LEN(v[i + 1]))) { [v[i], v[i + 1]] = [v[i + 1], v[i]]; }
      else { const same = LV[lv].filter(k => LEN(k) === LEN(v[i]) && k !== v[i]); if (!same.length) continue; v[i] = pickOne(same); }
      if (v.join() !== b.join()) return v; }
    return null;
  }
  const code = b => b.join(" ");
  // ---- question makers ----
  const MK = {
    meter: () => { const n = pickOne([2, 3, 4]), nm = { 2: "duple: 2 beats", 3: "triple: 3 beats", 4: "quadruple: 4 beats" }[n];
      return { q: "Listen for the strong beats. How many beats are in each bar?", a: nm, w: ["duple: 2 beats", "triple: 3 beats", "quadruple: 4 beats"].filter(x => x !== nm), why: `The strong beat comes every ${n} beats: ${nm.split(":")[0]} meter.`, play: { meter: n } }; },
    div: () => { const c = Math.random() < .5, a = c ? "compound: each beat divides in three" : "simple: each beat divides in two";
      return { q: "Listen to how each beat is divided. Is the meter simple or compound?", a, w: [c ? "simple: each beat divides in two" : "compound: each beat divides in three"], why: c ? "Three even notes in each beat: compound meter (like 6/8)." : "Two even notes in each beat: simple meter (like 2/4).", play: { div: c ? 3 : 2 } }; },
    dict: lv => { const b = bar(lv), w = []; for (let n = 0; w.length < 3 && n < 60; n++) { const v = variant(b, lv); if (v && !w.includes(code(v)) && code(v) !== code(b)) w.push(code(v)); }
      return { q: "After the count-in, you'll hear one bar of 4/4. Which rhythm is it?", a: code(b), w, why: "The bar: " + b.map(k => WORD[k]).join(", ") + ".", play: { bar: b } }; },
  };
  MK.d1 = () => MK.dict("d1"); MK.d2 = () => MK.dict("d2");
  const bank = () => { const out = []; picked().forEach((k, i) => { for (let n = 0; n < 15; n++) out.push(Object.assign({ s: i + 1 }, MK[k]())); }); return out; };

  // ---- notation for the answer buttons (VexFlow, drawn once per rhythm and cached as SVG markup) ----
  const SVG = {};
  function opt(v) {
    if (!/^[a-z0-9]+( [a-z0-9]+)*$/.test(v) || !v.split(" ").every(k => C[k])) return v.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    if (SVG[v]) return SVG[v];
    const label = v.split(" ").map(k => WORD[k]).join(", ");
    if (!window.Vex || !Vex.Flow) return label;
    const VF = Vex.Flow, el = document.getElementById("rqScratch"); el.innerHTML = "";
    try {
      const r = new VF.Renderer(el, VF.Renderer.Backends.SVG); r.resize(320, 92); const cx = r.getContext();
      const st = new VF.Stave(4, 4, 312); st.addClef("percussion").addTimeSignature("4/4").setContext(cx).draw();
      const notes = [];
      v.split(" ").forEach(k => C[k].forEach(([, d, rest, dot]) => { const sn = new VF.StaveNote({ keys: ["b/4"], duration: d + (dot ? "d" : "") + (rest ? "r" : ""), stem_direction: 1 }); if (dot) VF.Dot.buildAndAttach([sn], { all: true }); notes.push(sn); }));
      const voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).setMode(VF.Voice.Mode.SOFT).addTickables(notes);
      const beams = VF.Beam.generateBeams(notes, { groups: [new VF.Fraction(1, 4)] });
      new VF.Formatter().joinVoices([voice]).format([voice], st.getNoteEndX() - st.getNoteStartX() - 14); voice.draw(cx, st); beams.forEach(b => b.setContext(cx).draw());
      const svg = el.querySelector("svg"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", label); svg.removeAttribute("width"); svg.removeAttribute("height"); svg.setAttribute("viewBox", "0 0 320 92");
      SVG[v] = svg.outerHTML; el.innerHTML = ""; return SVG[v];
    } catch (e) { el.innerHTML = ""; return label; }
  }

  // ---- sound ----
  let AC = null, nodes = [];
  const ctx = () => { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return null; if (!AC) AC = new Ctx(); if (AC.state === "suspended") AC.resume(); return AC; };
  function hit(t, f, vol, len = .06, type = "square") { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .003); g.gain.exponentialRampToValueAtTime(.0008, t + len); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + len + .02); nodes.push(o); }
  const wood = (t, vol = .5) => { hit(t, 1180, vol, .09, "triangle"); hit(t, 2360, vol * .35, .04, "sine"); };
  const tick = (t, strong) => hit(t, strong ? 1500 : 1000, strong ? .22 : .12, .035);
  const drum = (t, strong) => { hit(t, strong ? 90 : 190, strong ? .9 : .38, strong ? .28 : .12, "sine"); };
  function play(p) {
    if (!ctx()) return; nodes.forEach(o => { try { o.stop(); } catch (e) {} }); nodes = [];
    let t = AC.currentTime + .1;
    if (p.meter) { const sp = .5; for (let i = 0; i < p.meter * 4; i++) { const s = i % p.meter === 0; drum(t, s); hit(t, s ? 660 : 880, s ? .1 : .05, .05, "triangle"); t += sp; } return; }
    if (p.div) { const beat = p.div === 3 ? .78 : .62; for (let b = 0; b < 8; b++) { drum(t + b * beat, b % 2 === 0); for (let d = 0; d < p.div; d++) wood(t + b * beat + d * beat / p.div, d ? .32 : .5); } return; }
    if (p.bar) { const sp = 60 / 76; for (let i = 0; i < 4; i++) tick(t + i * sp, i === 0); t += 4 * sp;   // count-in, then the bar over quiet beats
      for (let i = 0; i < 4; i++) tick(t + i * sp, false);
      let x = 0; p.bar.forEach(k => C[k].forEach(([d, , rest]) => { if (!rest) wood(t + x * sp); x += d; })); }
  }

  let run = 0;
  function start() {
    const ks = picked(), msg = document.getElementById("rqMsg");
    if (!ks.length) { msg.textContent = "Choose at least one skill."; return; }
    try { localStorage.setItem(KEY, JSON.stringify(ks)); } catch (e) {}
    msg.textContent = `${ks.length} skill${ks.length > 1 ? "s" : ""}: ${ks.map(k => SK.find(s => s[0] === k)[1].toLowerCase()).join("; ")}.`;
    const id = "rq" + (++run), host = document.getElementById("saqBox");
    host.innerHTML = SAquiz.html(id, "Press <b>Play</b>, then choose what you heard. If you miss, you get another try; only first tries count toward your score. Every try draws new questions from the skills you chose.");
    SAquiz.wire(host, id, bank, { play, opt, links: [{ href: "rhythm-performance.html", label: "Practice: Ear Training – Rhythm →", primary: true }] });
    const n = host.querySelector(".saq-q"); if (n) { n.setAttribute("tabindex", "-1"); n.focus(); }
  }
  document.getElementById("rqGo").addEventListener("click", start);
  document.getElementById("rqAll").addEventListener("click", () => { const bs = [...box.querySelectorAll("input")], on = !bs.every(b => b.checked); bs.forEach(b => b.checked = on); document.getElementById("rqAll").textContent = on ? "Clear" : "Select all"; });
  document.getElementById("rqLink").addEventListener("click", async () => {
    const ks = picked(), msg = document.getElementById("rqMsg"); if (!ks.length) { msg.textContent = "Choose at least one skill."; return; }
    const u = new URL(location.href); u.search = "?skills=" + ks.join(","); u.hash = "";
    try { await navigator.clipboard.writeText(u.href); msg.textContent = "Link copied: it opens this quiz with these skills."; } catch (e) { msg.textContent = u.href; } });
  if (url) { const go = () => window.SAquiz && start(); if (window.SAquiz) go(); else window.addEventListener("DOMContentLoaded", go); }
})();
</script>
