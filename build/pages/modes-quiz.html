<script>

  // Quiz questions: s = the lesson step that covers it (1-based). STEPS = the lesson's step titles, for the "Look back" links.
  const QZ = [{"s": 1, "q": "Play the white keys from D to D. Which mode is that?", "a": "D Dorian", "w": ["D Ionian", "D Aeolian", "D Phrygian"], "hint": "C major's notes from its 2nd degree.", "why": "Starting on the 2nd degree of the major scale gives Dorian."}, {"s": 1, "q": "Which mode starts on the 5th degree of a major scale?", "a": "Mixolydian", "w": ["Lydian", "Aeolian", "Locrian"], "hint": "1 Ionian, 2 Dorian, 3 Phrygian, 4 Lydian…", "why": "5 → Mixolydian (G to G on the white keys)."}, {"s": 3, "q": "Which modes are in the major family (major 3rd above the tonic)?", "a": "Lydian, Ionian, Mixolydian", "w": ["Dorian, Aeolian, Phrygian", "Lydian, Dorian, Locrian", "Ionian, Aeolian, Locrian"], "hint": "Check the summary: major family and minor family.", "why": "Lydian (♯4), Ionian, Mixolydian (♭7) have a major 3rd. The others have a minor 3rd."}, {"s": 3, "q": "Lydian is major with which note changed?", "a": "a raised 4th", "w": ["a lowered 7th", "a lowered 2nd", "a raised 6th"], "hint": "Remember the one note that differs from major or natural minor.", "why": "Lydian = major with ♯4."}, {"s": 4, "q": "Phrygian is natural minor with which note changed?", "a": "a lowered 2nd", "w": ["a raised 6th", "a raised 4th", "a lowered 5th"], "hint": "Listen for the note right above the tonic.", "why": "Phrygian = minor with ♭2."}, {"s": 5, "q": "In PADMIL order, which mode comes right after Dorian?", "a": "Mixolydian", "w": ["Aeolian", "Ionian", "Lydian"], "hint": "Phrygian, Aeolian, Dorian, Mixolydian, Ionian, Lydian.", "why": "P-A-D-M-I-L: after D comes M."}, {"s": 6, "q": "What key signature does A Dorian use?", "a": "1 sharp", "w": ["3 sharps", "no sharps or flats", "2 flats"], "hint": "Start from A major's signature, then Dorian is two flats more.", "why": "A major has 3 sharps; two flats more cancels two of them: 1 sharp (F♯)."}, {"s": 6, "q": "What key signature does E Lydian use?", "a": "5 sharps", "w": ["4 sharps", "3 sharps", "1 sharp"], "hint": "Lydian is one sharp more than the major key.", "why": "E major has 4 sharps; Lydian adds one: 5."}, {"s": 8, "q": "Which scale has an augmented 2nd between neighboring notes?", "a": "harmonic minor", "w": ["Dorian", "major pentatonic", "Mixolydian"], "hint": "It appears between 6 and 7.", "why": "Raising the 7th of natural minor opens a +2 between the 6th and 7th."}, {"s": 9, "q": "What does the blues scale add to minor pentatonic?", "a": "♯4 / ♭5", "w": ["♭2", "a major 3rd", "♯6"], "hint": "It's the one extra note.", "why": "Minor pentatonic plus ♯4/♭5 is the blues scale."}, {"s": 10, "q": "How many notes does an octatonic scale have?", "a": "8", "w": ["6", "7", "12"], "hint": "It alternates whole and half steps.", "why": "Octatonic: 8 notes. Whole-tone: 6."}];
  const STEPS = ["Relative modes", "Parallel modes", "Major or minor?", "In real music", "PADMIL", "Key signatures", "By ear", "Augmented 2nds", "Pentatonic & blues", "Symmetrical scales", "Summary"];
  const mount = () => { if (!window.SAquiz) return; const box = document.getElementById("saqBox"); box.innerHTML = SAquiz.html("page");
    SAquiz.wire(box, "page", QZ, { href: n => "modes-the-simple-truth.html#step=" + n, stepName: n => STEPS[n - 1] || "step " + n, links: [{"href": "modes-trainer.html", "label": "Practice: Modes drills →", "primary": true}, {"href": "modes-the-simple-truth.html", "label": "Back to the lesson"}] }); };
  if (window.SAquiz) mount(); else window.addEventListener("DOMContentLoaded", mount);
})();
</script>
