<script>

  // Quiz questions: s = the lesson step that covers it (1-based). STEPS = the lesson's step titles, for the "Look back" links.
  const QZ = [{"s": 1, "q": "What's the smallest interval on a keyboard, from one key to the very next?", "a": "a half step", "w": ["a whole step", "a 2nd", "an octave"], "hint": "Black keys count.", "why": "One key to the next, black or white, is a half step."}, {"s": 2, "q": "C up to G spans how many letter names, counting C as 1?", "a": "5, so it's a 5th", "w": ["7, so it's a 7th", "4, so it's a 4th", "8, so it's an octave"], "hint": "C D E F G.", "why": "Size comes from counting letters: C D E F G is five, a 5th. (It's 7 half steps.)"}, {"s": 2, "q": "Which part of an interval's name comes from counting half steps?", "a": "the quality (major, minor, perfect…)", "w": ["the size (2nd, 3rd…)", "neither", "both"], "hint": "Two numbers: size and quality.", "why": "Letters give the size; half steps give the quality."}, {"s": 3, "q": "A major 3rd made one half step smaller (same letters) becomes…", "a": "a minor 3rd", "w": ["a diminished 3rd", "a perfect 3rd", "an augmented 2nd"], "hint": "2nds, 3rds, 6ths and 7ths are the major/minor family.", "why": "Major made smaller is minor. Minor made smaller again would be diminished."}, {"s": 3, "q": "Which intervals belong to the perfect family?", "a": "unisons, 4ths, 5ths and octaves", "w": ["2nds, 3rds, 6ths and 7ths", "only 5ths", "3rds and 6ths"], "hint": "They have no major or minor version.", "why": "Unisons, 4ths, 5ths and octaves are perfect, diminished or augmented."}, {"s": 4, "q": "C–D♯ and C–E♭ sound the same. Why do they have different names?", "a": "They span different numbers of letters", "w": ["One is higher than the other", "One uses a black key", "They don't; they're both minor 3rds"], "hint": "An interval is named from its spelling.", "why": "C–D♯ spans two letters (an augmented 2nd); C–E♭ spans three (a minor 3rd)."}, {"s": 4, "q": "On the white keys, which 5th is not perfect?", "a": "B up to F", "w": ["C up to G", "E up to B", "D up to A"], "hint": "It's a half step smaller than the others.", "why": "B–F is a diminished 5th. Every other white-key 5th is perfect."}, {"s": 6, "q": "A song is moved up 3 half steps to suit a singer. What happens to its intervals?", "a": "They stay exactly the same", "w": ["They all get 3 half steps bigger", "They flip direction", "They become minor"], "hint": "That's why you can still recognize it.", "why": "Transposition changes every note but keeps every interval."}, {"s": 7, "q": "A motive leaps up a 5th. In its melodic inversion, it…", "a": "leaps down a 5th", "w": ["leaps up a 4th", "leaps up an octave", "plays the notes backwards"], "hint": "Keep the sizes; flip the direction.", "why": "Melodic inversion turns every up into a down."}, {"s": 9, "q": "After a wide leap up, what does a melody usually do?", "a": "come back down, often by step", "w": ["leap up again", "stop", "repeat the top note"], "hint": "Stretch, then resolve.", "why": "Most tunes balance a big leap with stepwise motion the other way."}, {"s": 10, "q": "Which stack makes a major triad, from the bottom up?", "a": "a major 3rd, then a minor 3rd", "w": ["a minor 3rd, then a major 3rd", "two major 3rds", "two minor 3rds"], "hint": "Lowering the middle note flips it to minor.", "why": "C–E is a major 3rd and E–G a minor 3rd: C major."}];
  const STEPS = ["What is an interval?", "Size and quality", "Stretch and squeeze", "Spelling counts", "Melodies", "Transposition", "Inversion", "Singing", "Tension", "Chords", "Distance from home", "Atonal music"];
  const mount = () => { if (!window.SAquiz) return; const box = document.getElementById("saqBox"); box.innerHTML = SAquiz.html("page");

  if (window.SAquiz) mount(); else window.addEventListener("DOMContentLoaded", mount);
})();
